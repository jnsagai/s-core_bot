schema_version: 1
profile: local

server:
  host: 127.0.0.1
  port: 8080
  allowed_hosts:
    - localhost
    - 127.0.0.1
  allowed_origins:
    - http://127.0.0.1:8080
    - http://localhost:8080

data_dir: ../data

runtime:
  provider: ollama
  base_url: http://127.0.0.1:11434
  cloud_fallback: false
  model_profile: local-small
  generation_model: qwen3:4b-instruct
  embedding_model: nomic-embed-text
  context_tokens: 8192
  output_tokens: 900

retrieval:
  lexical_candidates: 30
  semantic_candidates: 30
  evidence_chunks: 8
  fusion_constant: 60

limits:
  question_characters: 4000
  history_characters: 12000
  active_generations: 1
  queued_generations: 4
  request_deadline_seconds: 120

privacy:
  persist_chats: false
  log_message_bodies: false
  telemetry: false

diagnostics:
  runtime_connect_timeout_seconds: 1.0
  runtime_read_timeout_seconds: 3.0
  readiness_cache_seconds: 2.0
  disk_margin_bytes: 2147483648

name: CI

# F001 baseline (FR-018, FR-019): deterministic checks only. No Ollama, no model download, no
# paid API. Real-model evaluation (the `real_runtime` pytest marker) is a separate, later gate
# (docs/PROJECT_SPEC.md §18.1) and is never run here.

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, types, tests, licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"

      - name: Sync locked dependencies (offline-reproducible)
        run: uv sync --locked --all-groups

      - name: Format check
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test (deterministic; real_runtime tests skip without a live Ollama)
        run: uv run pytest

      - name: Install locked frontend dependencies (for the npm license inventory)
        run: npm ci
        working-directory: frontend

      - name: Dependency license check (Python + npm)
        run: uv run python scripts/check_licenses.py

      - name: Traceability completeness check
        run: uv run python scripts/check_traceability.py

  frontend:
    # F006: the static UI bundle. Uses the Node.js preinstalled on the runner (no extra action).
    name: Frontend lint, types, tests, build, asset and telemetry checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node version
        run: node --version && npm --version

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test (jsdom; no browser)
        run: npm test

      - name: Build
        run: npm run build

      - name: No third-party assets in the bundle
        run: npm run check-no-third-party-assets

      - name: No telemetry SDK
        run: npm run check-no-telemetry

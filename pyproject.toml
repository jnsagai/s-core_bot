[project]
name = "s-core-docs-assistant"
version = "0.1.0"
description = "Local-first, open-source documentation assistant for Eclipse S-CORE (community project)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.54.0",
    "pydantic>=2.13.5",
    "typer>=0.27.2",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "psutil>=7.2.2",
    "docutils>=0.23",
    "markdown-it-py>=4.2.0",
    "numpy>=2.5.3",
]

[project.scripts]
score-assistant = "score_docs_assistant.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/score_docs_assistant"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "mypy>=2.3.1",
    "types-pyyaml",
    "types-psutil",
    "types-docutils",
    "pip-licenses>=5.5.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The model policy is prose sent verbatim to the model; wrapping it would change the prompt.
"src/score_docs_assistant/answers/policy.py" = ["E501"]
"src/score_docs_assistant/comparison/policy.py" = ["E501"]
# Embedded JavaScript sent to the browser verbatim.
"scripts/browser_check.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["score_docs_assistant"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_runtime: requires a real Ollama runtime; skipped unless SCORE_ASSISTANT_REAL_RUNTIME=1",
    "real_network: contacts GitHub; skipped unless SCORE_ASSISTANT_REAL_NETWORK=1",
]
# This workstation sources /opt/ros/iron/setup.bash, which puts ROS's Python 3.10 site-packages
# on PYTHONPATH; pytest's setuptools entry-point scan then finds ROS's pytest11 plugins (built for
# a different Python/pytest) and crashes on import. Blocking them by entry-point name is harmless
# where they are absent (e.g. CI) — `-p no:X` is a no-op if X was never registered.
addopts = "-p no:launch_ros -p no:launch_testing -p no:ament_flake8 -p no:ament_copyright -p no:ament_pep257 -p no:ament_xmllint -p no:ament_lint -p no:colcon_core_warnings_stderr"
